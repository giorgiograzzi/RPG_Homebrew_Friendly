server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Pagina, service worker e manifest: mai in cache, così un aggiornamento arriva subito
  # (un index.html vecchio punterebbe a file spariti, e un sw.js vecchio terrebbe l'app ferma alla versione precedente)
  location = /index.html { include /etc/nginx/headers.conf; add_header Cache-Control "no-cache, must-revalidate" always; }
  location = /sw.js { include /etc/nginx/headers.conf; add_header Cache-Control "no-cache, must-revalidate" always; add_header Service-Worker-Allowed "/" always; }
  location = /manifest.webmanifest { include /etc/nginx/headers.conf; add_header Cache-Control "no-cache, must-revalidate" always; default_type application/manifest+json; }
  location ~ ^/workbox-[^/]+\.js$ { include /etc/nginx/headers.conf; add_header Cache-Control "no-cache, must-revalidate" always; }

  # File con il nome che cambia a ogni build: si tengono per sempre (senza "always" nell'intestazione, così una 404 non resta in cache)
  location /assets/ { include /etc/nginx/headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # Icone e scheda PDF: cambiano di rado
  location ~ ^/(icons)/ { include /etc/nginx/headers.conf; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }

  # Landing statica (cartella sito/): indirizzo /sito/, i suoi file non passano dall'app
  location = /sito { return 301 /sito/; }
  location /sito/ { include /etc/nginx/headers.conf; add_header Cache-Control "no-cache, must-revalidate" always; index index.html; try_files $uri $uri/ =404; }

  # App a pagina singola: ogni altro indirizzo apre l'app (le rotte sono gestite dal client)
  location / {
    include /etc/nginx/headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
