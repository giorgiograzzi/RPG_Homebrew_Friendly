# App dei personaggi SRD: nginx con i file statici dell'app.
# Avvio:  docker compose up -d --build        (la porta si cambia in .env, vedi .env.example)
services:
  srd-personaggi:
    build: .
    image: srd-personaggi:latest
    container_name: srd-personaggi
    restart: unless-stopped
    ports:
      - "${PORT:-8097}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
