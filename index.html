<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />
    <meta name="description" content="Crea e gestisci personaggi con le regole libere dell'SRD 5.2.1, in italiano e inglese, anche senza rete." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181b2e" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Placet del Master" />
    <title>Placet del Master</title>
  </head>
  <body>
    <script>
      // Aspetto scelto dall'utente: va applicato prima del primo disegno, per non far lampeggiare il tema sbagliato
      try { var th = localStorage.getItem("theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (_) {}
    </script>
    <script>
      // Rete di sicurezza: se un file dell'app non si carica (index.html vecchio in cache dopo un aggiornamento) si ricarica una volta sola
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
        try { if (sessionStorage.getItem("reloaded")) return; sessionStorage.setItem("reloaded", "1"); } catch (_) { return; }
        location.replace(location.pathname + "?v=" + Date.now());
      }, true);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
